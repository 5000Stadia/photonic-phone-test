<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photonic People Demo</title>
<style>
  :root { --ground: #5f6266; --ink: #f3f4f5; --shade: rgba(16, 18, 20, 0.62); --chip: rgba(16, 18, 20, 0.55); --chip-on: #1f6f8b; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); overflow: hidden; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  #panel { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; pointer-events: none; }
  #about, #hud { background: var(--shade); padding: 8px 10px; border-radius: 8px; max-width: 34rem; }
  #hud { font: 12px/1.45 ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; white-space: pre-wrap; }
  #nav { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 6px; }
  #nav a { font: 13px system-ui, sans-serif; color: var(--ink); background: var(--chip); border: 1px solid rgba(255,255,255,0.18); padding: 8px 11px; border-radius: 999px; text-decoration: none; }
  #nav a.on { background: var(--chip-on); border-color: transparent; }
  #nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js"
}}</script>
</head>
<body>
<div id="panel"><div id="about">loading…</div><div id="hud"></div></div>
<nav id="nav"></nav>
<script type="module" src="./demo.js"></script>
</body>
</html>
